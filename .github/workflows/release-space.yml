name: Build Space demo bundle
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Build interface
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Package application and checkpoint
        run: python scripts/package_space.py
      - name: Publish deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" .local/leaflens-space.zip
